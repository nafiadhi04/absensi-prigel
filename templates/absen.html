<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sistem Absensi Wajah</title>

    <!-- Font + Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- PANGGIL CSS EKSTERNAL -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- face-api -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>

    <div class="main-container">
        <h1>Sistem Absensi Wajah</h1>

        <div class="card-container">
            <!-- KARTU KAMERA -->
            <div class="card camera-section">
                <h2><i class="fas fa-camera"></i> Kamera</h2>

                <!-- Container Video -->
                <div class="video-container">
                    <video id="video" autoplay muted playsinline></video>
                    <canvas id="detection_overlay"></canvas>
                </div>

                <!-- Status Message -->
                <div id="status" class="status-message info">Memuat model AI...</div>

                <!-- Tombol Aksi -->
                <div class="action-row" id="actionRow" style="display:none; flex-direction: column; gap: 10px;">
    <button id="btnRegister" class="btn register" style="display:none;"><i class="fas fa-user-plus"></i> Daftar Wajah</button>
    
    <div style="width: 100%;">
        <button id="tombolReset" class="btn reset" style="display:none; width: 100%;"><i class="fas fa-redo"></i> Reset Tampilan</button>
    </div>

    <div style="width: 100%;">
        <button id="btnKeUtama" class="btn reset" style="display:none; width: 100%;" onclick="window.location.href='/'">
            <i class="fas fa-home"></i> Ke Halaman Utama
        </button>
    </div>
</div>

                <p id="keteranganDeteksi" style="margin-top:12px; font-size:0.85em; color:#666;">(Sistem mendeteksi wajah otomatis — tahan 3 detik untuk absen)</p>
            </div>

            <!-- KARTU HASIL -->
            <div class="card result-section" id="hasilAbsensiCard" style="display:none;">
                <h2><i class="fas fa-clipboard-list"></i> Data Absensi</h2>
                
                <div id="status-overall" class=""></div>

                <div class="user-info">
                    <img id="foto_sebelumnya" src="https://via.placeholder.com/120?text=Foto" alt="Foto Referensi">
                    <h3 id="hasil_nama">-</h3>
                    <p>NIP: <span id="hasil_nip">-</span></p>
                    <p>Prodi: <span id="hasil_prodi">-</span></p>
                </div>

                <div class="time-details">
                    <div><span><i class="far fa-clock"></i> Jam Berangkat</span><span id="hasil_berangkat">-</span></div>
                    <div><span><i class="fas fa-door-open"></i> Jam Pulang</span><span id="hasil_pulang">-</span></div>
                    
                    <!-- BAGIAN BARU: WAKTU DIHABISKAN -->
                    <div class="total-time">
                        <span><i class="fas fa-hourglass-half"></i> Waktu Dihabiskan</span>
                        <span id="hasil_durasi">-</span>
                    </div>
                </div>
            </div>
        </div>

    <canvas id="snapshot_canvas" style="display:none;"></canvas>

    <script>
        /* ====== DOM ELEMENTS ====== */
        const video = document.getElementById('video');
        const overlay = document.getElementById('detection_overlay');
        const snapshotCanvas = document.getElementById('snapshot_canvas');
        const statusDiv = document.getElementById('status');
        const hasilAbsensiCard = document.getElementById('hasilAbsensiCard');
        const statusOverallDiv = document.getElementById('status-overall');
        const btnRegister = document.getElementById('btnRegister');
        const tombolReset = document.getElementById('tombolReset');
        const actionRow = document.getElementById('actionRow');
        const keteranganDeteksi = document.getElementById('keteranganDeteksi');

        /* ====== KONFIGURASI ====== */
        let retryAttempts = 0;
        const maxRetries = 3;
        const retryCooldownMs = 3000;
        const MODEL_URL = '/static/models'; 

        /* ====== VARIABEL STATE ====== */
        let isProcessing = false;
        let timerId = null;
        let detectionActive = true; // Flag untuk mengontrol deteksi

        /* ====== FUNGSI HELPER ====== */
        function updateStatus(message, type='info') {
            statusDiv.textContent = message;
            statusDiv.className = `status-message ${type}`;
            if (type === 'error' || type === 'info') {
                actionRow.style.display = (type === 'info' || type === 'error') ? 'flex' : 'none';
            }
        }

        // FUNGSI BARU: MENGHITUNG DURASI
        function hitungDurasi(jamMasuk, jamPulang) {
            if (!jamMasuk || !jamPulang || jamPulang === 'Belum absen pulang' || jamPulang === 'None') {
                return 'Belum Lengkap';
            }

            // Format jam biasanya "HH:MM:SS"
            const [startH, startM] = jamMasuk.split(':').map(Number);
            const [endH, endM] = jamPulang.split(':').map(Number);

            const startDate = new Date();
            startDate.setHours(startH, startM, 0, 0);

            const endDate = new Date();
            endDate.setHours(endH, endM, 0, 0);

            // Jika jam pulang lebih kecil dari jam masuk (lembur lewat tengah malam)
            if (endDate < startDate) {
                endDate.setDate(endDate.getDate() + 1);
            }

            const diffMs = endDate - startDate;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffMinutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

            return `${diffHours} Jam ${diffMinutes} Menit`;
        }

        function resizeOverlayToVideo() {
            if (video.videoWidth > 0 && video.videoHeight > 0) {
                overlay.width = video.videoWidth;
                overlay.height = video.videoHeight;
                overlay.style.width = '100%';
                overlay.style.height = '100%';
                overlay.style.display = 'block';
                try { faceapi.matchDimensions(overlay, { width: overlay.width, height: overlay.height }); } catch(e) {}
                return true;
            }
            return false;
        }

        /* ====== KIRIM SNAPSHOT KE SERVER ====== */
        async function ambilDanKirimSnapshot() {
            updateStatus("Mengambil snapshot...", 'info');

            if (video.videoWidth === 0) {
                updateStatus("Gagal: ukuran video belum tersedia.", 'error');
                isProcessing = false; return;
            }

            snapshotCanvas.width = video.videoWidth;
            snapshotCanvas.height = video.videoHeight;
            snapshotCanvas.getContext('2d').drawImage(video, 0, 0, snapshotCanvas.width, snapshotCanvas.height);
            const dataUrl = snapshotCanvas.toDataURL('image/jpeg', 0.9);

            try {
                const resp = await fetch('/api/absen', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: dataUrl })
                });
                const data = await resp.json();

                if (data.success) {
                    retryAttempts = 0;
                    updateStatus(`Sukses: ${data.message}`, 'success');

                    const jamMasuk = data.data.jam_berangkat || '-';
                    const jamPulang = data.data.jam_pulang || 'Belum absen pulang';
                    const isPulang = data.data.jam_pulang && data.data.jam_pulang !== 'Belum absen pulang';

                    statusOverallDiv.textContent = isPulang ? "Absen Pulang Berhasil!" : "Absen Masuk Berhasil!";
                    statusOverallDiv.className = isPulang ? 'warning' : 'success';

                    hasilAbsensiCard.style.display = 'block';
                    document.getElementById('hasil_nama').innerText = data.data.nama || '-';
                    document.getElementById('hasil_nip').innerText = data.data.nip || '-';
                    document.getElementById('hasil_prodi').innerText = data.data.prodi || '-';
                    document.getElementById('hasil_berangkat').innerText = jamMasuk;
                    document.getElementById('hasil_pulang').innerText = jamPulang;
                    
                    // UPDATE DURASI DI SINI
                    document.getElementById('hasil_durasi').innerText = hitungDurasi(jamMasuk, jamPulang);

                    if (data.data.foto_sebelumnya) {
                        document.getElementById('foto_sebelumnya').src = '/' + data.data.foto_sebelumnya + '?v=' + new Date().getTime();
                    }

                    tombolReset.style.display = 'inline-block';
                    btnKeUtama.style.display = 'inline-block';
                    btnRegister.style.display = 'none';
                    actionRow.style.display = 'flex';
                    keteranganDeteksi.style.display = 'none';
                    
                    // MATIKAN DETEKSI SETELAH SUKSES
                    detectionActive = false;
                    updateStatus("Absensi berhasil! Kamera aktif (tidak memproses).", 'info');
                    
                    isProcessing = false;
                    return;
                }

                // --- Retry Logic ---
                const notRegistered = (typeof data.message === 'string' && 
                    (data.message.toLowerCase().includes('tidak terdaftar') || data.message.toLowerCase().includes('wajah tidak terdaftar')));

                if (notRegistered) {
                    retryAttempts++;
                    if (retryAttempts <= maxRetries) {
                        updateStatus(`Wajah tidak dikenal — mencoba lagi (${retryAttempts}/${maxRetries})...`, 'error');
                        setTimeout(() => { isProcessing = false; updateStatus("Silakan hadapkan wajah ke kamera.", 'info'); }, retryCooldownMs);
                        return;
                    } else {
                        updateStatus("Wajah tidak terdaftar. Silakan daftar dulu.", 'error');
                        btnRegister.style.display = 'inline-block';
                        tombolReset.style.display = 'inline-block';
                        actionRow.style.display = 'flex';
                        isProcessing = false;
                        return;
                    }
                }

                updateStatus(`Gagal: ${data.message}`, 'error');
                btnRegister.style.display = 'inline-block';
                tombolReset.style.display = 'inline-block';
                actionRow.style.display = 'flex';
                isProcessing = false;

            } catch (err) {
                console.error('Error Fetch:', err);
                updateStatus("Error koneksi ke server.", 'error');
                isProcessing = false;
                btnRegister.style.display = 'inline-block';
                actionRow.style.display = 'flex';
            }
        }

        /* ====== DETEKSI WAJAH ====== */
        async function startFaceDetectionAuto() {
            updateStatus("Memuat model AI...", 'info');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error akses kamera:", err);
                updateStatus("Gagal akses kamera.", 'error');
                return;
            }

            video.addEventListener('loadedmetadata', resizeOverlayToVideo);
            video.addEventListener('play', resizeOverlayToVideo);
            window.addEventListener('resize', () => setTimeout(resizeOverlayToVideo, 150));

            try {
                await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                updateStatus("Kamera Siap. Hadapkan wajah Anda.", 'info');
            } catch (err) {
                updateStatus("Gagal memuat model AI.", 'error');
                return;
            }

            setInterval(async () => {
                if (video.readyState < 3 || video.videoWidth === 0) return;
                if (!resizeOverlayToVideo()) return;

                try {
                    const detection = await faceapi.detectSingleFace(video, new faceapi.SsdMobilenetv1Options());
                    const ctx = overlay.getContext('2d');
                    ctx.clearRect(0, 0, overlay.width, overlay.height);

                    if (detection) {
                        const displaySize = { width: overlay.width, height: overlay.height };
                        const resized = faceapi.resizeResults(detection, displaySize);
                        faceapi.draw.drawDetections(overlay, resized);

                        // CEKK detectionActive FLAG
                        if (detectionActive && !isProcessing && !timerId) {
                            updateStatus("Wajah terdeteksi... Tahan...", 'info');
                            timerId = setTimeout(() => {
                                isProcessing = true;
                                ambilDanKirimSnapshot();
                                timerId = null;
                            }, 2000);
                        }
                    } else {
                        if (timerId) { clearTimeout(timerId); timerId = null; if (detectionActive && !isProcessing) updateStatus("Kamera siap...", 'info'); }
                    }
                } catch (err) {}
            }, 200);
        }

        btnRegister.onclick = function() { window.location.href = '/'; };
        tombolReset.onclick = function() {
            hasilAbsensiCard.style.display = 'none';
            tombolReset.style.display = 'none';
            btnRegister.style.display = 'none';
            btnKeUtama.style.display = 'none';
            actionRow.style.display = 'none';
            retryAttempts = 0;
            
            // AKTIFKAN KEMBALI DETEKSI
            detectionActive = true;
            keteranganDeteksi.style.display = 'block';

            // AKTIFKAN KEMBALI DETEKSI
            detectionActive = true;
            
            updateStatus("Kamera siap. Hadapkan wajah Anda.", 'info');
        };

        window.addEventListener('load', startFaceDetectionAuto);
    </script>
</body>
</html>
